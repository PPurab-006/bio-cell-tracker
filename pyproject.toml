[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bio3d-cell-tracker"
version = "0.1.0"
description = "Physically-informed 3D+time cell detection, tracking, and lineage reconstruction for developing zebrafish microscopy"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Purab", email = "research@example.com" }]
dependencies = [
    "numpy>=1.26.0,<3.0.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "scikit-image>=0.22.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "zarr>=3.0.0",
    "polars>=1.0.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "tracksdata>=0.1.0rc10",
    "kaggle>=2.2.4",
    "torch>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -p no:launch_testing -p no:launch_testing_ros -p no:ament_copyright -p no:ament_pep257 -p no:ament_lint -p no:ament_mypy -p no:ament_flake8 -p no:ament_xmllint"
